<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>

    apiKey: "AIzaSyBg9qEWHAqD0D8GwfywA5syIG8dRPYye3g",
    authDomain: "lupi-ai-2846f.firebaseapp.com",
    projectId: "lupi-ai-2846f",
    storageBucket: "lupi-ai-2846f.firebasestorage.app",
    messagingSenderId: "376572426861",
    appId: "1:376572426861:web:03e75339bac14d9c7f9d64"
  };
  firebase.initializeApp(firebaseConfig);
  window._db = firebase.firestore();
</script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg:    #fafafa;
    --card:  #ffffff;
    --border:#e5e5e5;
    --t1:    #111111;
    --t2:    #555555;
    --t3:    #999999;
    --accent:#111111;
    --green: #16a34a;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--t1);
    min-height: 100dvh;
  }

  /* ── HEADER ── */
  .cat-header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .cat-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .cat-brand-icon {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: var(--t1);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .cat-brand-icon svg { width: 16px; height: 16px; fill: #fff; stroke: none; }

  .cat-brand-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--t1);
    letter-spacing: -.4px;
  }

  .cat-brand-sub {
    font-size: 11px;
    color: var(--t3);
    margin-top: 1px;
  }

  .cat-search-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .cat-search-wrap svg {
    position: absolute;
    left: 12px;
    width: 15px; height: 15px;
    stroke: var(--t3); fill: none;
    stroke-width: 1.8; stroke-linecap: round;
    pointer-events: none;
  }
  .cat-search {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px 9px 36px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: var(--t1);
    width: 220px;
    outline: none;
    transition: border-color .2s;
  }
  .cat-search:focus { border-color: var(--t2); }
  .cat-search::placeholder { color: var(--t3); }

  /* ── HERO ── */
  .cat-hero {
    padding: 56px 24px 40px;
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
  }
  .cat-hero-title {
    font-size: clamp(28px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: -.04em;
    line-height: 1.15;
    color: var(--t1);
  }
  .cat-hero-sub {
    font-size: 15px;
    color: var(--t2);
    margin-top: 12px;
    line-height: 1.6;
  }

  /* ── MAIN ── */
  .cat-main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }

  .cat-count {
    font-size: 12px;
    font-weight: 500;
    color: var(--t3);
    margin-bottom: 20px;
    letter-spacing: .02em;
  }

  /* ── PRODUCT GRID ── */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .cat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow .2s, transform .2s;
    cursor: default;
  }
  .cat-card:hover {
    box-shadow: 0 8px 32px rgba(0,0,0,.08);
    transform: translateY(-2px);
  }

  .cat-card-img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: var(--bg);
    display: block;
  }

  .cat-card-img-placeholder {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cat-card-img-placeholder svg {
    width: 36px; height: 36px;
    stroke: #ccc; fill: none;
    stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  }

  .cat-card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .cat-card-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--t1);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .cat-card-price {
    font-size: 18px;
    font-weight: 700;
    color: var(--t1);
    letter-spacing: -.02em;
    margin-top: 6px;
  }

  .cat-card-estoque {
    font-size: 11px;
    color: var(--green);
    font-weight: 500;
    margin-top: 3px;
  }

  /* ── EMPTY / LOADING ── */
  .cat-empty {
    text-align: center;
    padding: 80px 20px;
    grid-column: 1 / -1;
  }
  .cat-empty-icon {
    width: 64px; height: 64px;
    border-radius: 18px;
    background: #f0f0f0;
    display: inline-flex;
    align-items: center; justify-content: center;
    margin-bottom: 16px;
  }
  .cat-empty-icon svg { width: 28px; height: 28px; stroke: #bbb; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .cat-empty h3 { font-size: 17px; font-weight: 600; color: var(--t1); margin-bottom: 6px; }
  .cat-empty p  { font-size: 13px; color: var(--t3); }

  .cat-loading {
    text-align: center;
    padding: 80px 20px;
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--t3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .spin {
    width: 16px; height: 16px;
    border: 2px solid #e5e5e5;
    border-top-color: var(--t2);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── FOOTER ── */
  .cat-footer {
    text-align: center;
    padding: 28px 20px;
    font-size: 12px;
    color: var(--t3);
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  .cat-footer a { color: var(--t2); text-decoration: none; font-weight: 500; }
  .cat-footer a:hover { color: var(--t1); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .cat-header { padding: 0 16px; }
    .cat-search { display: none; }
    .cat-hero { padding: 36px 16px 28px; }
    .cat-main { padding: 0 12px 40px; }
    .cat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .cat-card-body { padding: 11px 12px 13px; }
    .cat-card-price { font-size: 16px; }
  }
</style>
</head>
<body>

<header class="cat-header">
  <div class="cat-brand">
    <div class="cat-brand-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 2.5-5 5 1.5 7L12 20l-6.5 3.5L7 16.5 2 11.5 9 9z"/></svg>
    </div>
    <div>
      <div class="cat-brand-name" id="headerStoreName">Loja</div>
      <div class="cat-brand-sub" id="headerStoreSub">Catálogo de produtos</div>
    </div>
  </div>
  <div class="cat-search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="cat-search" type="text" id="searchInput" placeholder="Buscar produtos..." oninput="filtrarProdutos(this.value)">
  </div>
</header>

<section class="cat-hero">
  <div class="cat-hero-title" id="heroTitle">Nossos Produtos</div>
  <div class="cat-hero-sub" id="heroSub">Confira o que temos disponível para você</div>
</section>

<main class="cat-main">
  <div class="cat-count" id="prodCount"></div>
  <div class="cat-grid" id="catGrid">
    <div class="cat-loading"><div class="spin"></div> Carregando produtos…</div>
  </div>
</main>

<footer class="cat-footer">
  Catálogo gerado por <a href="https://lupiai.com.br" target="_blank">LupiAI</a>
</footer>

<script>
  let todosOsProdutos = [];

  function getUID() {
    const p = new URLSearchParams(window.location.search);
    return p.get('uid');
  }

  async function carregarCatalogo() {
    const uid = getUID();
    const grid = document.getElementById('catGrid');
    if (!uid) {
      grid.innerHTML = `<div class="cat-empty"><div class="cat-empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><h3>Link inválido</h3><p>Este catálogo não foi configurado corretamente.</p></div>`;
      return;
    }

    try {
      const snap = await window._db
        .collection('usuarios').doc(uid)
        .collection('estoque_db').doc('dados')
        .get();

      if (!snap.exists) {
        exibirVazio();
        return;
      }

      const dados = JSON.parse(snap.data().valor);
      console.log("TODOS OS PRODUTOS:", JSON.stringify(dados));
      // Mostra: emPromocao=true OU (tem preço de venda), desde que tenha estoque
      todosOsProdutos = (dados || []).filter(p => p.quantidade > 0 && (p.emPromocao || p.precoVenda > 0));
      console.log("FILTRADOS:", todosOsProdutos.length);
      renderGrid(todosOsProdutos);

    } catch(e) {
      console.error(e);
      grid.innerHTML = `<div class="cat-empty"><div class="cat-empty-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div><h3>Erro ao carregar</h3><p>Tente novamente em alguns instantes.</p></div>`;
    }
  }

  function renderGrid(produtos) {
    const grid  = document.getElementById('catGrid');
    const count = document.getElementById('prodCount');
    if (produtos.length === 0) { exibirVazio(); return; }
    count.textContent = `${produtos.length} produto${produtos.length !== 1 ? 's' : ''} disponíve${produtos.length !== 1 ? 'is' : 'l'}`;
    grid.innerHTML = produtos.map(p => `
      <div class="cat-card">
        ${p.imagemBase64
          ? `<img class="cat-card-img" src="${p.imagemBase64}" alt="${p.produto}" loading="lazy">`
          : `<div class="cat-card-img-placeholder"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`
        }
        <div class="cat-card-body">
          <div class="cat-card-name">${p.produto}</div>
          ${p.precoVenda > 0
            ? `<div class="cat-card-price">R&nbsp;${(p.precoVenda).toFixed(2).replace('.', ',')}</div>`
            : ''
          }
          <div class="cat-card-estoque">${p.quantidade} disponíve${p.quantidade !== 1 ? 'is' : 'l'}</div>
        </div>
      </div>
    `).join('');
  }

  function filtrarProdutos(q) {
    const termo = q.trim().toLowerCase();
    if (!termo) { renderGrid(todosOsProdutos); return; }
    renderGrid(todosOsProdutos.filter(p => p.produto.toLowerCase().includes(termo)));
  }

  function exibirVazio() {
    const grid  = document.getElementById('catGrid');
    const count = document.getElementById('prodCount');
    if (count) count.textContent = '';
    grid.innerHTML = `
      <div class="cat-empty">
        <div class="cat-empty-icon">
          <svg viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/><path d="M16 3H8L6 7h12l-2-4z"/></svg>
        </div>
        <h3>Nenhum produto disponível</h3>
        <p>Volte em breve — em breve teremos novidades!</p>
      </div>`;
  }

  carregarCatalogo();
</script>
</body>
</html>
